; PixelCharm firmware build settings.

[platformio]
default_envs = wokwi

; Shared by every environment below
[env]
; Pinned so every build uses the same toolchain (Arduino-ESP32 core 3.3.12).
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX @ 1.2.32

; Wokwi simulator: ESP32-S3 + 2.8" ILI9341 (Wokwi has no ST7789). We only draw in the top 240x240.
[env:wokwi]
build_flags = -DPANEL_ILI9341

; The real board (ESP32-S3-DevKitC-1 N16R8 + 1.54" ST7789) gets its own environment in task 1.7.
