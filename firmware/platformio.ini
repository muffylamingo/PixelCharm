; PixelCharm firmware build settings.

[platformio]
; The real board is the default since task 1.6. Pick "env:wokwi" in VS Code to build for the simulator.
default_envs = devkit

; Shared by every environment below
[env]
; Pinned so every build uses the same toolchain (Arduino-ESP32 core 3.3.12).
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX @ 1.2.32
    ; Fast JPEG decoder (uses the ESP32-S3's vector instructions); LovyanGFX's own one took ~360 ms per picture
    bitbank2/JPEGDEC @ 1.8.4
    ; GIF player from the same author (task 1.9)
    bitbank2/AnimatedGIF @ 2.2.3
; Flash layout (task 1.8): code + a LittleFS "disk" for the theme pictures, sized for 8 MB.
; Files in firmware/data/ go onto that disk with "Upload Filesystem Image".
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
; JPEGDEC's ESP32-S3 assembly files include an esp-dsp header (which includes the Xtensa CPU config),
; but PlatformIO only passes a few include folders to assembly files. These add the two they need.
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-dsp/modules/fft/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-esp32s3-libs/include/xtensa/esp32s3/include

; Wokwi simulator: ESP32-S3 + 2.8" ILI9341 (Wokwi has no ST7789). We only draw in the top 240x240.
[env:wokwi]
build_flags =
    ${env.build_flags}
    -DPANEL_ILI9341

; The real board: ESP32-S3-DevKitC-1 clone N16R8 (16 MB flash, 8 MB octal PSRAM) + 1.3" 240x240 ST7789.
; The board file describes the N8 version, so the flash size and the PSRAM type are set here.
; Upload and Serial Monitor go through the USB port marked COM/UART.
[env:devkit]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DPANEL_ST7789
    -DBOARD_HAS_PSRAM
    ; No push buttons on the board yet: A and B are wire tips you touch with a finger (see button.h)
    -DBUTTONS_TOUCH
