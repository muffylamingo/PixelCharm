; PixelCharm firmware build settings.
; The real board (ESP32-S3-DevKitC-1 N16R8) needs extra flash/PSRAM settings; they come in task 1.7.

[platformio]
default_envs = devkit

[env:devkit]
; Pinned so every build uses the same toolchain (Arduino-ESP32 core 3.3.12).
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
